<!doctype html><html><head><title>Native pre-insertion validation</title></head><body><script>
function check(ok,name){console.log((ok?'PASS ':'FAIL ')+name);}
function error(fn,name,code){try{fn();return false;}catch(e){return e.name===name&&e.code===code;}}
function doc(){return document.implementation.createDocument(null,null,null);}
function dt(){return document.implementation.createDocumentType('root','','');}
function fail(parent,node,ref,name){var old=node.parentNode,owner=node.ownerDocument,first=node.firstChild,last=node.lastChild,pc=parent.childNodes.length;check(error(function(){parent.insertBefore(node,ref);},'HierarchyRequestError',3),name);check(node.parentNode===old&&node.ownerDocument===owner&&node.firstChild===first&&node.lastChild===last&&parent.childNodes.length===pc,name+' preserves participants');}
var x=doc(),a=x.createElement('a'),c=x.createComment('before'),d=dt(),tail=x.createComment('after');x.appendChild(c);x.appendChild(d);x.appendChild(tail);check(x.childNodes.length===3&&x.firstChild===c&&c.nextSibling===d&&d.nextSibling===tail,'comments and doctype ordinary order');x.insertBefore(a,tail);check(x.documentElement===a&&a.previousSibling===d&&a.nextSibling===tail,'element valid after doctype before comment');
fail(x,x.createElement('second'),null,'second Document element rejected');fail(x,dt(),null,'second Document doctype rejected');fail(x,x.createTextNode(''),null,'empty direct Document Text rejected');fail(x,x.createTextNode('data'),null,'nonempty direct Document Text rejected');fail(x,a,a,'Document element self-reference still validates existing element');fail(x,d,d,'Document doctype self-reference still validates existing doctype');
var e=doc(),ec=e.createComment('lead'),ed=dt();e.appendChild(ec);e.appendChild(ed);fail(e,e.createElement('early'),ec,'element before comment preceding doctype rejected');fail(e,e.createElement('early'),ed,'element before doctype itself rejected');check(e.appendChild(e.createElement('ok')).nodeName==='ok','element append after doctype allowed');
var z=doc(),zr=z.createElement('root'),zc=z.createComment('last');z.appendChild(zr);z.appendChild(zc);fail(z,dt(),null,'doctype append after element rejected');fail(z,dt(),zc,'doctype before trailing comment after element rejected');var zd=dt();z.insertBefore(zd,zr);check(z.firstChild===zd&&zd.nextSibling===zr,'doctype before actual element accepted');
var zz=doc(),lead=zz.createComment('lead'),end=zz.createComment('end');zz.appendChild(lead);zz.appendChild(end);var zdt=dt();zz.insertBefore(zdt,end);check(lead.nextSibling===zdt&&zdt.nextSibling===end,'doctype may follow leading comments');
var f=document.createDocumentFragment(),f1=document.createElement('one'),f2=document.createElement('two'),fc=document.createComment('middle');f.appendChild(f1);f.appendChild(fc);f.appendChild(f2);var empty=doc();fail(empty,f,null,'whole two-element fragment rejected');check(f.childNodes.length===3&&f1.nextSibling===fc&&fc.nextSibling===f2&&f1.ownerDocument===document,'all rejected fragment children retain identity order owner');
var tf=document.createDocumentFragment(),tc=document.createComment('before'),tt=document.createTextNode(''),te=document.createElement('element');tf.appendChild(tc);tf.appendChild(te);tf.appendChild(tt);fail(empty,tf,null,'fragment with empty Text after element rejected');check(tf.firstChild===tc&&tf.lastChild===tt&&te.ownerDocument===document,'rejected Text fragment is never partially spliced or adopted');
var onlyText=document.createDocumentFragment();onlyText.appendChild(document.createTextNode(''));fail(empty,onlyText,null,'Text-only fragment rejected');
var good=document.createDocumentFragment(),g1=document.createComment('lead'),ge=document.createElement('root'),g2=document.createComment('tail');good.appendChild(g1);good.appendChild(ge);good.appendChild(g2);empty.appendChild(good);check(good.childNodes.length===0&&empty.firstChild===g1&&g1.nextSibling===ge&&ge.nextSibling===g2&&empty.documentElement===ge,'valid one-element fragment spliced in order');check(good.ownerDocument===empty&&ge.ownerDocument===empty&&g1.ownerDocument===empty,'successful fragment adopts all current owners');
var comments=document.createDocumentFragment(),cm=document.createComment('more');comments.appendChild(cm);empty.insertBefore(comments,ge);check(cm.parentNode===empty&&cm.nextSibling===ge&&comments.childNodes.length===0,'comment-only fragment allowed with existing element');var no=document.createDocumentFragment();empty.appendChild(no);check(no.ownerDocument===empty&&empty.childNodes.length===4,'empty fragment accepted and adopted');
var one=document.createDocumentFragment();one.appendChild(document.createElement('other'));fail(empty,one,null,'one-element fragment rejects existing Document element');var before=doc(),beforeComment=before.createComment('lead'),beforeType=dt();before.appendChild(beforeComment);before.appendChild(beforeType);fail(before,one,beforeComment,'one-element fragment before later doctype rejected');fail(before,one,beforeType,'one-element fragment before doctype reference rejected');before.appendChild(one);check(before.documentElement.nodeName==='other'&&one.childNodes.length===0,'one-element fragment after doctype accepted');
var p=document.createElement('p'),n=document.createElement('n'),q=document.createElement('q');p.appendChild(n);p.appendChild(q);check(p.insertBefore(n,n)===n&&p.firstChild===n&&n.nextSibling===q,'ordinary Element self-reference preserves ordering');p.appendChild(n);check(p.firstChild===q&&q.nextSibling===n,'ordinary Element existing child may move');fail(p,dt(),null,'doctype into Element rejected');var pf=document.createDocumentFragment();fail(pf,dt(),null,'doctype into Fragment rejected');fail(p,doc(),null,'Document cannot be inserted');
var outsider=document.createElement('outside');check(error(function(){p.insertBefore(p,outsider);},'HierarchyRequestError',3),'cycle error precedes invalid reference');check(error(function(){n.insertBefore(p,outsider);},'HierarchyRequestError',3),'inclusive ancestor error precedes invalid reference');check(error(function(){p.insertBefore(doc(),outsider);},'NotFoundError',8),'invalid reference precedes invalid incoming Document type');check(error(function(){empty.insertBefore(document.createTextNode('bad'),outsider);},'NotFoundError',8),'invalid reference precedes Document Text restriction');check(error(function(){empty.insertBefore(no,outsider);},'NotFoundError',8),'empty Fragment still checks reference');var text=document.createTextNode('text');fail(text,document.createComment('bad'),null,'CharacterData cannot receive children');
var polluted=doc();Object.defineProperty(polluted,'documentElement',{get:function(){throw new Error('visible element');}});Object.defineProperty(polluted,'doctype',{get:function(){throw new Error('visible doctype');}});Object.defineProperty(polluted,'childNodes',{get:function(){throw new Error('visible list');}});var native=doc().createElement('native');polluted.appendChild(native);check(native.parentNode===polluted,'Document validation ignores visible Document properties');check(error(function(){polluted.appendChild(document.createElement('bad'));},'HierarchyRequestError',3),'actual element count survives visible property pollution');
var frame=document.createElement('iframe');document.body.appendChild(frame);var w=frame.contentWindow,childDoc=frame.contentDocument,xml=childDoc.implementation.createDocument(null,null,null),borrow=document.createElement('borrowed');Node.prototype.appendChild.call(xml,borrow);check(borrow.ownerDocument===xml&&xml.documentElement===borrow,'borrowed primary method validates and adopts actual child XML Document');check(error(function(){w.Node.prototype.appendChild.call(xml,document.createElement('bad'));},'HierarchyRequestError',3),'borrowed child method rejects actual existing XML root');frame.remove();check(xml.documentElement===borrow&&borrow.ownerDocument===xml,'saved XML graph valid after child frame removal');
console.log('pre-insertion probe done');
</script></body></html>
