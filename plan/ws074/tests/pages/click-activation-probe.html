<!doctype html><html><head><title>Native script click activation</title></head><body><script>

var proto=HTMLInputElement.prototype;['disabled','indeterminate'].forEach(function(n){var d=Object.getOwnPropertyDescriptor(proto,n);check(raises(function(){d.get.call({});},'TypeError'),n+' getter brand');check(raises(function(){d.set.call(document.createElement('div'),truth);},'TypeError'),n+' setter brand');});
var detached=input('checkbox'), detachedEvents=[];detached.onclick=function(){detachedEvents.push('click');};detached.oninput=function(){detachedEvents.push('input');};detached.onchange=function(){detachedEvents.push('change');};detached.click();check(detached.checked&&detachedEvents.join(',')==='click','detached toggle and click without notifications');
var removal=input('checkbox');document.body.appendChild(removal);var rmEvents=[];removal.onclick=function(){removal.remove();rmEvents.push('click');};removal.oninput=function(){rmEvents.push('input');};removal.click();check(removal.checked&&rmEvents.join(',')==='click','removal in click suppresses notifications');
var form=document.createElement('form');document.body.appendChild(form);var a=input('radio','group'),b=input('radio','group');form.appendChild(a);form.appendChild(b);a.checked=true;var re=[];b.onclick=function(e){re.push('click');check(!a.checked&&b.checked,'radio listeners observe exclusivity');};b.oninput=function(){re.push('input');};b.onchange=function(){re.push('change');};b.click();check(!a.checked&&b.checked&&re.join(',')==='click,input,change','radio select order');re=[];b.click();check(re.join(',')==='click'&&b.checked,'selected radio only click');
a.checked=true;b.onclick=function(e){e.preventDefault();};re=[];b.click();check(a.checked&&!b.checked&&re.length===0,'radio cancellation restores previous and suppresses notifications');
b.onclick=function(e){a.name='other';e.preventDefault();};b.click();check(!a.checked&&!b.checked,'cancellation cannot restore previous changed group');a.name='group';a.checked=true;b.onclick=function(e){a.remove();e.preventDefault();};b.click();check(!a.checked&&!b.checked,'removed prior radio not restored');form.insertBefore(a,b);a.checked=true;

b.onclick=null;a.checked=true;Object.defineProperty(b,'checked',{get:function(){throw 'shadow checked';}});Object.defineProperty(b,'type',{get:function(){throw 'shadow type';}});b.click();var current=Object.getOwnPropertyDescriptor(proto,'checked').get;check(current.call(b)&&!a.checked,'click uses native state despite shadowed accessors');

var field=document.createElement('fieldset');field.setAttribute('disabled','');field.innerHTML='<legend><input type=checkbox id=first></legend><legend><input type=checkbox id=second></legend><input type=checkbox id=outside>';document.body.appendChild(field);var first=field.querySelector('#first'),second=field.querySelector('#second'),outside=field.querySelector('#outside');first.click();second.click();outside.click();check(first.checked,'first legend exception');check(!second.checked&&!outside.checked,'second legend and outside disabled');check(!outside.disabled,'inherited disabled not reflected own attr');field.removeAttribute('disabled');outside.click();check(outside.checked,'live fieldset disabling removal');

var div=document.createElement('div'), ordinary=0;div.setAttribute('disabled','');div.onclick=function(e){ordinary++;check(!e.isTrusted,'ordinary script click untrusted');div.click();};div.click();check(ordinary===1,'ordinary disabled expando does not suppress click and recursion');check(raises(function(){HTMLElement.prototype.click.call({});},'TypeError'),'click native receiver brand');
var foreign=document.createElementNS('urn:foreign','input');foreign.setAttribute('type','checkbox');foreign.setAttribute('disabled','');var foreignCount=0;foreign.addEventListener('click',function(){foreignCount++;});HTMLElement.prototype.click.call(foreign);check(foreignCount===1&&!foreign.checked,'foreign input no activation/disabled behavior');
var changed=input('checkbox');document.body.appendChild(changed);var changedCount=0;changed.onclick=function(){changed.type='text';};changed.oninput=function(){changedCount++;};changed.click();check(changed.checked&&changedCount===0,'current changed type suppresses notifications');
var child=document.createElement('iframe');document.body.appendChild(child);var cd=child.contentDocument,cw=child.contentWindow;var cb=cd.createElement('input');cb.type='checkbox';cd.body.appendChild(cb);var childEvent;cb.onclick=function(e){childEvent=e;};HTMLElement.prototype.click.call(cb);check(cb.checked&&childEvent instanceof cw.MouseEvent&&childEvent.view===cw,'borrowed click uses actual child event realm');child.remove();cb.click();check(!cb.checked,'saved child input click after iframe removal');

</script></body></html>
