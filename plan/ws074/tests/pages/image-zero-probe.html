<!doctype html><html><head><style>html,body{margin:0;height:100%}img{vertical-align:top}iframe{display:block;width:0;height:0;border:0}</style></head><body><script>
function check(ok,name){console.log((ok?'PASS ':'FAIL ')+name);}
var img=document.createElement('img');img.style.cssText='width:0;height:10px';document.body.appendChild(img);check(img.height===10&&img.width===0,'primary empty-width inline image keeps rendered height');var r=img.getBoundingClientRect();check(r.width===0&&r.height===10,'actual empty-width fragment rectangle remains observable');
img.style.cssText='width:10px;height:0';check(img.width===10&&img.height===0,'primary empty-height image keeps rendered width');r=img.getBoundingClientRect();check(r.width===10&&r.height===0,'actual empty-height fragment rectangle remains observable');
img.style.cssText='width:0;height:0';check(img.width===0&&img.height===0,'bothzero rendered image dimensions remain zero');
img.style.cssText='width:0;height:10px;border:2px solid;padding:3px';check(img.width===0&&img.height===10,'empty content still excludes nonempty frame');r=img.getBoundingClientRect();check(r.width===10&&r.height===20,'border rectangle includes actual padding and borders');
var f=document.createElement('iframe');document.body.appendChild(f);var d=f.contentDocument;d.open();d.write('<style>html,body{margin:0;height:100%}img{width:0;height:10px;vertical-align:top}</style><img width=7 height=8>');d.close();var child=d.images[0];check(child.width===0&&child.height===10,'zero viewport inline image has actual empty native box');
child.style.cssText='width:50%;height:25%';check(child.width===0&&child.height===0,'definite zero percentages override content attribute hints');f.style.width='120px';f.style.height='80px';check(child.width===60&&child.height===20,'same child percentage follows nonzero actual viewport');f.style.width='0px';f.style.height='0px';check(child.width===0&&child.height===0,'same child percentage follows restoration to zero');
child.style.display='none';check(child.width===7&&child.height===8,'absence of a rendered box remains attribute fallback');child.style.display='inline';check(child.width===0&&child.height===0,'rendered zero box differs from display none');
child.style.cssText='width:0;height:10px';check(child.getBoundingClientRect().height===10,'zero width native child rectangle retains height');f.remove();check(child.width===7&&child.height===8,'retired zero image remains nonrendered fallback');console.log('image zero probe done');
</script></body></html>
