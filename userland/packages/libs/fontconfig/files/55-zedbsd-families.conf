<fontconfig>
  <description>Prefer the fonts zedBSD installs for the generic families</description>
	<!--
	  The desktop installs Inter, JetBrains Mono, Droid Sans Fallback and
	  Noto Color Emoji in /usr/share/fonts.  The upstream family lists do
	  not name Inter, so without this file sans-serif fell to JetBrains
	  Mono.  It sits before 60-latin.conf so that these come first, and the
	  fallback font follows each text face for the scripts it lacks.
	-->
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Inter</family>
			<family>Droid Sans Fallback</family>
		</prefer>
	</alias>
	<alias>
		<family>system-ui</family>
		<prefer>
			<family>Inter</family>
			<family>Droid Sans Fallback</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>JetBrains Mono</family>
			<family>Droid Sans Fallback</family>
		</prefer>
	</alias>
	<alias>
		<family>emoji</family>
		<prefer>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
</fontconfig>
