name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl git grub-common gzip ninja-build \
            mtools patch xz-utils

      - name: Acquire verified source inputs
        run: make download

      - name: Install pinned LLVM toolchain cache
        run: |
          make toolchain-cache
          make -j16 toolchain

      - name: Build amd64
        run: |
          cp config/ci/config-amd64.mk config.mk
          make -j16
          mkdir -p artifacts
          # The 2 GiB native image is published gzip-compressed.
          gzip -9 -c build/amd64/hdd-image.img > artifacts/zedbsd-amd64.img.gz

      - name: Package Kei-nightly.zip
        # Until the base package is on the rev-0 release, a failure here leaves
        # the image release as it was.
        continue-on-error: true
        run: |
          # The Windows package (WINQ-EMU QEMU with Venus) comes from the
          # rev-0 release, verified by the SHA-256 in tools/release/kei-nightly.mk.
          make kei-nightly-zip
          cp build/amd64/Kei-nightly.zip artifacts/Kei-nightly.zip

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            artifacts/*.img.gz
            artifacts/Kei-nightly.zip

  keiland-deb:
    name: Keiland deb (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            target: keiland-linux-debian
          - distro: ubuntu2604
            target: keiland-linux-ubuntu2604
    env:
      KEILAND_DEB_ACCEL: tcg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 curl git openssh-client \
            qemu-system-x86 qemu-utils xorriso

      - name: Build and verify native guest package
        run: make ${{ matrix.target }}

      - name: Verify release inputs
        run: python3 tools/release/keiland-linux-deb/verify-artifacts.py --require-clean build/keiland-deb/artifacts/${{ matrix.distro }} ${{ matrix.distro }}

      - name: Upload verified package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: keiland-linux-${{ matrix.distro }}
          path: build/keiland-deb/artifacts/${{ matrix.distro }}/*
          if-no-files-found: error


  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    needs:
      - build
      - keiland-deb
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Download Keiland packages
        uses: actions/download-artifact@v4
        with:
          pattern: keiland-linux-*
          path: artifacts
          merge-multiple: true

      - name: Checkout release verifier
        uses: actions/checkout@v4
        with:
          path: release-source

      - name: Verify both distributions before publication
        run: python3 release-source/tools/release/keiland-linux-deb/verify-artifacts.py --require-clean artifacts debian13 ubuntu2604

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          prerelease: true

          body: |
            This is an automated nightly build. Not an official release.
            
            zedBSD OS
            =========
            
            | CPU     | Machine      | File                  | Description                                             |
            |---------|--------------|-----------------------|---------------------------------------------------------|
            | amd64   | PC (UEFI)    | `zedbsd-amd64.img.gz` | USB image, gzip-compressed (`gunzip` before writing).   |
            | amd64   | Windows      | `Kei-nightly.zip`     | Kei in QEMU with Vulkan (Venus). Unzip and run `boot.bat`. |

            Keiland Linux (native QEMU build and installation tests)
            =======================================================

            | OS | CPU | Package |
            |----|-----|---------|
            | Debian 13 | amd64 | `keiland_*+debian13_amd64.deb` |
            | Ubuntu 26.04 | amd64 | `keiland_*+ubuntu2604_amd64.deb` |

            SHA-256 checksums, payload manifests and Keiland JSON build records
            accompany both packages. Install with `sudo apt install ./keiland_*.deb`.

          files: |
            artifacts/zedbsd-amd64.img.gz
            artifacts/Kei-nightly.zip
            artifacts/*.deb
            artifacts/*.sha256
            artifacts/*.manifest.json
            artifacts/*.buildinfo.json
